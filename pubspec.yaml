name: mindfultech_app
description: "MindfulTech - Aplikasi produktivitas dan manajemen energi harian"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: 4.6.6
  dio: ^5.9.2
  get_storage: ^2.1.1
  google_fonts: ^8.1.0
  flutter_svg: ^2.2.4
  percent_indicator: ^4.2.5
  animate_do: ^5.1.0
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

